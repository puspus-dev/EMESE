# Render Blueprint – EMESE API (egy projekt: egy adatbázis, egy API, egy import cron)
# Dashboard: New → Blueprint → ez a repó (a render.yaml a gyökérben van)
# https://render.com/docs/blueprint-spec
#
# A városok (Kisvarda/, Nyiregyhaza/, ...) ugyanabban a Postgresben vannak, külön sémában.

services:
  - type: web
    name: emese-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

  # Opcionális: GTFS frissítés 3 naponta, minden városra (Render Cron – fizetős/korlátozott free-en)
  - type: cron
    name: emese-gtfs-import
    runtime: python
    plan: free
    schedule: "30 2 */3 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_gtfs.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
