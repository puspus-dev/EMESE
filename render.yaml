# Render Blueprint – EMESE API (Kisvárda + Nyíregyháza)
# Dashboard: New → Blueprint → ez a repó (a render.yaml a gyökérben van)
# https://render.com/docs/blueprint-spec
#
# Egy közös (ingyenes) Postgres van, a városok külön sémában tárolódnak:
#   Kisvarda/  -> kisvarda séma,  Nyiregyhaza/ -> nyiregyhaza séma

databases:
  - name: emese-db
    plan: free
    databaseName: emese
    user: emese

services:
  # ---------- Kisvárda ----------
  - type: web
    name: emese-api-kisvarda
    runtime: python
    plan: free
    rootDir: Kisvarda
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emese-db
          property: connectionString
      - key: EMESE_CITY
        value: Kisvarda
      - key: PYTHON_VERSION
        value: "3.12"

  # Opcionális: GTFS frissítés 3 naponta (Render Cron – fizetős/korlátozott free-en)
  - type: cron
    name: emese-gtfs-import-kisvarda
    runtime: python
    plan: free
    rootDir: Kisvarda
    schedule: "30 2 */3 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_gtfs.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emese-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"

  # ---------- Nyíregyháza ----------
  - type: web
    name: emese-api-nyiregyhaza
    runtime: python
    plan: free
    rootDir: Nyiregyhaza
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emese-db
          property: connectionString
      - key: EMESE_CITY
        value: Nyiregyhaza
      - key: PYTHON_VERSION
        value: "3.12"

  - type: cron
    name: emese-gtfs-import-nyiregyhaza
    runtime: python
    plan: free
    rootDir: Nyiregyhaza
    schedule: "30 2 */3 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_gtfs.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emese-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
